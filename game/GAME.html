<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>METEOR DASH</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:monospace; color:#fff; }
h1 { font-size:32px; letter-spacing:6px; margin-bottom:8px; }
p.sub { font-size:12px; color:#888; letter-spacing:3px; margin-bottom:32px; }
.btn-group { display:flex; gap:12px; margin-bottom:16px; }
button { padding:12px 24px; font-family:monospace; font-size:13px; letter-spacing:2px; background:transparent; border:1px solid #fff; color:#fff; cursor:pointer; }
button:hover { background:#222; }
#guide { font-size:12px; color:#666; margin-top:12px; }
#gameWrapper { display:none; position:relative; }
canvas { display:block; border:1px solid #333; }
#restartBtn { display:none; position:absolute; bottom:50px; left:50%; transform:translateX(-50%); padding:10px 28px; font-family:monospace; font-size:12px; background:transparent; border:1px solid #fff; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="menu">
  <h1>METEOR DASH</h1>
  <p class="sub">SURVIVE THE COSMIC STORM</p>
  <p style="font-size:11px;color:#aaa;letter-spacing:2px;margin-bottom:14px;">— 난이도 선택 —</p>
  <div class="btn-group">
    <button onclick="startGame('NORMAL')">EASY</button>
    <button onclick="startGame('HARD')">NORMAL</button>
    <button onclick="startGame('SUPER HARD')">HARD</button>
  </div>
  <div id="guide">← → 이동 &nbsp;|&nbsp; SPACE 점프 (이단점프)</div>
</div>

<div id="gameWrapper">
  <canvas id="c" width="900" height="500"></canvas>
  <button id="restartBtn" onclick="returnMenu()">← MENU</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');
const gameWrapper = document.getElementById('gameWrapper');
const restartBtn = document.getElementById('restartBtn');

const GW = canvas.width, GH = canvas.height;
const GROUND = GH - 30;
const GRAVITY = 0.55;

let baseSpeed, spawnRate, gameSpeed;
let score, timeElapsed, gameOver, animId;
let startTime, lastItemTime;
let player, obstacles, skyObs, meteors, items;
let bombTimer = 0, groundCooldown = 0;
const keys = {};

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  keys.left  = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if ((e.key === ' ' || e.code === 'Space') && !gameOver) {
    e.preventDefault();
    if (player && player.jumps < 2) { player.vy = -13; player.jumps++; }
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft')  keys.left  = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

function startGame(diff) {
  if (diff === 'NORMAL')     { baseSpeed = 7;  spawnRate = 0.02;  }
  if (diff === 'HARD')       { baseSpeed = 10; spawnRate = 0.025; }
  if (diff === 'SUPER HARD') { baseSpeed = 14; spawnRate = 0.03;  }
  gameSpeed = baseSpeed;
  score = 0; gameOver = false; bombTimer = 0; groundCooldown = 0;
  obstacles = []; skyObs = []; meteors = []; items = [];
  player = { x:80, y:GROUND-26, w:26, h:26, vx:0, vy:0, jumps:0, lives:3, iTimer:0, flashTimer:0 };
  startTime = Date.now(); lastItemTime = Date.now(); timeElapsed = 0;
  menu.style.display = 'none';
  gameWrapper.style.display = 'block';
  restartBtn.style.display = 'none';
  loop();
}

function returnMenu() {
  cancelAnimationFrame(animId);
  gameWrapper.style.display = 'none';
  menu.style.display = 'block';
}

/* ---- spawn ---- */
function spawnGround() {
  if (bombTimer > 0 || groundCooldown > 0) return;
  if (Math.random() < spawnRate) {
    const w = 18 + Math.random()*25, h = 25 + Math.random()*70;
    obstacles.push({ x: GW, y: GROUND - h, w, h });
    groundCooldown = 45;
  }
}
function spawnSky() {
  if (bombTimer > 0 || groundCooldown > 0) return;
  if (timeElapsed >= 25 && Math.random() < 0.012) {
    const y = GROUND - 90 - Math.random()*160;
    skyObs.push({ x: GW, y, w: 50, h: 18 });
  }
}
function spawnMeteor() {
  if (bombTimer > 0) return;
  if (timeElapsed >= 60 && Math.random() < 0.022) {
    const r = 18 + Math.random()*12;
    meteors.push({ x: Math.random()*(GW - r*2)+r, y:-r, r, speed: 4+Math.random()*4 });
  }
}
function checkItem() {
  if (Date.now() - lastItemTime < 20000) return;
  const clear = obstacles.filter(o => o.x > 150 && o.x < 850);
  const sClear = skyObs.filter(s => s.x > 150 && s.x < 850);
  if (clear.length || sClear.length) return;
  lastItemTime = Date.now();
  const y = GROUND - 50 - Math.random()*60;
  const r = Math.random()*100;
  const type = r < 55 ? 'HEAL' : r < 80 ? 'INVINCIBLE' : 'BOMB';
  items.push({ x: GW, y, r: 18, type });
}

/* ---- collision ---- */
function rectHit(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
function circHit(cx,cy,cr, rx,ry,rw,rh) {
  const nx = Math.max(rx, Math.min(cx, rx+rw));
  const ny = Math.max(ry, Math.min(cy, ry+rh));
  return (cx-nx)**2 + (cy-ny)**2 < cr**2;
}

/* ---- update ---- */
function update() {
  if (gameOver) return;
  timeElapsed = Math.floor((Date.now()-startTime)/1000);
  gameSpeed = baseSpeed + timeElapsed * 0.05;
  if (bombTimer > 0) bombTimer--;
  if (groundCooldown > 0) groundCooldown--;
  if (player.flashTimer > 0) player.flashTimer--;

  // player move
  if (keys.left)  player.vx = -10;
  else if (keys.right) player.vx = 10;
  else player.vx = 0;
  player.vy += GRAVITY;
  player.x += player.vx; player.y += player.vy;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > GW) player.x = GW - player.w;
  if (player.y + player.h >= GROUND) { player.y = GROUND - player.h; player.vy = 0; player.jumps = 0; }

  if (player.iTimer > 0) player.iTimer--;

  const px=player.x, py=player.y, pw=player.w, ph=player.h;

  function hitPlayer() {
    if (player.iTimer > 0) return false;
    player.lives--; player.iTimer = 90; player.flashTimer = 90;
    if (player.lives <= 0) { gameOver = true; restartBtn.style.display = 'block'; }
    return true;
  }

  // ground obstacles
  for (let i = obstacles.length-1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= gameSpeed;
    if (rectHit(px,py,pw,ph, o.x,o.y,o.w,o.h)) {
      if (player.invincible) { obstacles.splice(i,1); score+=150; continue; }
      hitPlayer(); obstacles.splice(i,1); continue;
    }
    if (o.x + o.w < 0) { obstacles.splice(i,1); score += 100; }
  }

  // sky obstacles
  for (let i = skyObs.length-1; i >= 0; i--) {
    const s = skyObs[i];
    s.x -= gameSpeed + 1.2;
    if (rectHit(px,py,pw,ph, s.x,s.y,s.w,s.h)) {
      if (player.invincible) { skyObs.splice(i,1); score+=200; continue; }
      hitPlayer(); skyObs.splice(i,1); continue;
    }
    if (s.x + s.w < 0) { skyObs.splice(i,1); score+=150; }
  }

  // meteors
  for (let i = meteors.length-1; i >= 0; i--) {
    const m = meteors[i];
    m.y += m.speed;
    if (circHit(m.x,m.y,m.r, px,py,pw,ph)) {
      if (player.invincible) { meteors.splice(i,1); score+=300; continue; }
      hitPlayer(); meteors.splice(i,1); continue;
    }
    if (m.y - m.r > GH) { meteors.splice(i,1); score+=200; }
  }

  // items
  for (let i = items.length-1; i >= 0; i--) {
    const it = items[i];
    it.x -= gameSpeed * 0.5;
    if (circHit(it.x,it.y,it.r, px,py,pw,ph)) {
      if (it.type === 'HEAL') { if (player.lives < 3) player.lives++; }
      else if (it.type === 'INVINCIBLE') { player.invincible = true; player.iTimer = 300; setTimeout(()=>{ player.invincible=false; }, 5000); }
      else if (it.type === 'BOMB') { bombTimer=120; obstacles=[]; skyObs=[]; meteors=[]; score+=500; }
      items.splice(i,1); continue;
    }
    if (it.x + it.r < 0) items.splice(i,1);
  }

  score++;
  spawnGround(); spawnSky(); spawnMeteor(); checkItem();
}

/* ---- draw ---- */
function draw() {
  ctx.clearRect(0,0,GW,GH);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,GW,GH);

  // ground line
  ctx.fillStyle = '#333';
  ctx.fillRect(0, GROUND, GW, GH - GROUND);

  // obstacles (white rect)
  ctx.fillStyle = '#fff';
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

  // sky obstacles (gray rect)
  ctx.fillStyle = '#aaa';
  skyObs.forEach(s => ctx.fillRect(s.x, s.y, s.w, s.h));

  // meteors (white circle)
  ctx.fillStyle = '#fff';
  meteors.forEach(m => {
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
  });

  // items
  items.forEach(it => {
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
    ctx.fillStyle = it.type==='HEAL'?'#f55':it.type==='INVINCIBLE'?'#ff0':'#f80';
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(it.type==='HEAL'?'HP':it.type==='INVINCIBLE'?'무':'💣', it.x, it.y+4);
  });

  // bomb overlay
  if (bombTimer > 0) {
    ctx.fillStyle = 'rgba(255,100,0,0.1)';
    ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle = '#f80';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('💣 BOMB ACTIVE', GW/2, 60);
  }

  // player
  const visible = player.flashTimer <= 0 || Math.floor(player.flashTimer/5) % 2 === 0;
  if (visible) {
    ctx.fillStyle = player.invincible ? '#ff0' : '#0af';
    ctx.fillRect(player.x, player.y, player.w, player.h);
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.font = '13px monospace';
  ctx.fillText(`SCORE: ${score}`, 12, 22);
  ctx.fillText(`TIME: ${timeElapsed}s`, 12, 42);
  ctx.fillText(`LIVES: ${'■'.repeat(player.lives)}${'□'.repeat(3-player.lives)}`, 12, 62);

  if (timeElapsed >= 60) {
    ctx.fillStyle = '#f55';
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('⚠ METEOR STORM ACTIVE', GW/2, 22);
  }

  // game over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle = '#f55';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', GW/2, GH/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText(`SCORE: ${score}  |  TIME: ${timeElapsed}s`, GW/2, GH/2 + 20);
  }
}

function loop() {
  update(); draw();
  if (!gameOver) animId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
