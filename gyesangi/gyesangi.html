<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>프로그래머 계산기</title>
    <style>
        .calculator {
            width: 320px;
            margin: 50px auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
        }
        button:hover:not(:disabled) { background-color: #eee; }
        button:disabled {
            background-color: #f0f0f0;
            color: #ccc;
            cursor: not-allowed;
        }
        .col-2 { grid-column: span 2; }
        .col-4 { grid-column: span 4; }
        .equal { background-color: #4CAF50; color: white; }
        .prog-btn { background-color: #e3f2fd; font-weight: bold; }
        .active-mode { background-color: #2196F3; color: white; }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled>
        
        <div class="buttons">
            <button onclick="toggleProgrammerMode()" id="modeToggle" class="col-4 prog-btn">프로그래머 모드: OFF</button>
            
            <button onclick="convertToBase(2)" class="base-btn" disabled>2진수</button>
            <button onclick="convertToBase(8)" class="base-btn" disabled>8진수</button>
            <button onclick="convertToBase(16)" class="base-btn" disabled>16진수</button>
            <button onclick="clearDisplay()">C</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')">/</button>
            
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')">*</button>
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')">-</button>
            
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculate()" class="equal">=</button>
            <button onclick="appendToDisplay('+')">+</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const baseButtons = document.querySelectorAll('.base-btn');
        const modeToggle = document.getElementById('modeToggle');
        let isProgrammerMode = false;

        // 1. 프로그래머 모드 토글 함수
        function toggleProgrammerMode() {
            isProgrammerMode = !isProgrammerMode;
            
            if (isProgrammerMode) {
                modeToggle.innerText = "프로그래머 모드: ON";
                modeToggle.classList.add('active-mode');
                // 버튼 활성화
                baseButtons.forEach(btn => btn.disabled = false);
            } else {
                modeToggle.innerText = "프로그래머 모드: OFF";
                modeToggle.classList.remove('active-mode');
                // 버튼 비활성화
                baseButtons.forEach(btn => btn.disabled = true);
            }
        }

        // 2. 진법 변환 함수
        function convertToBase(base) {
            try {
                // 현재 입력된 값을 숫자로 변환 (수식이면 계산 후 변환)
                let currentVal = eval(display.value);
                if (isNaN(currentVal)) throw "Error";
                
                // 해당 진법으로 변환하여 출력 (16진수는 대문자로)
                display.value = currentVal.toString(base).toUpperCase();
            } catch (e) {
                display.value = "Error";
            }
        }

        // 기존 기본 기능들
        function appendToDisplay(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>
</body>
</html>
